url = "https://download.brother.com/welcome/dlf103212/hll9310cdwlpr-1.5.0-3.i386.rpm"
regex = 'hll9310cdwlpr-([0-9.]+)-3\.i386\.rpm'

[brother-hll9310cdw-cups]
source = "regex"
url = "https://download.brother.com/welcome/dlf103221/hll9310cdwcupswrapper-1.5.0-3.i386.rpm"
regex = 'hll9310cdwcupswrapper-([0-9.]+)-3\.i386\.rpm'

[bruno]
