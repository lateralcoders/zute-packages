name: propose package bumps

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump PKGBUILDs from vendor checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'company-arch-bot'
          git config user.email 'bot@local'
          git fetch origin
          base=$(git rev-parse HEAD)
          mapfile -t pkgs < <(grep -vE '^[[:space:]]*(#|$)' allowlist.txt)
          for name in "${pkgs[@]}"; do
            git checkout -f "$base"
            git clean -fd -- packages
            if ! bash scripts/propose-update.sh "$name"; then
              echo "propose-update.sh failed for $name" >&2
              continue
            fi
            if git diff --quiet -- "packages/$name/PKGBUILD"; then
              echo "$name: nothing to do"
              continue
            fi
            ver=$(awk -F= '/^pkgver=/ {gsub(/["'\''()]/,"",$2); print $2; exit}' "packages/$name/PKGBUILD")
            branch="bump-$name-$ver"
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "$branch already on origin"
              continue
            fi
            git checkout -b "$branch"
            git add "packages/$name/PKGBUILD"
            git commit -m "chore($name): $ver from vendor checksums"
            git push -u origin "$branch"
            sums=$(awk -F= '/^sums_url=/ {sub(/^[^=]+=/,""); print; exit}' "packages/$name/upstream")
            gh pr create --title "chore($name): $ver" \
              --body "Hash taken from ${sums}"$'\n\n'"Human must merge. Bot cannot add packages or edit allowlist.txt."
          done
