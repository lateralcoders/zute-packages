name: propose Keeper bump

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump PKGBUILD from vendor SHASUM256.txt
        run: bash scripts/propose-keeper-update.sh
      - name: open PR if the tree changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'company-arch-bot'
          git config user.email 'bot@local'
          if git diff --quiet -- packages/keeper-password-manager/PKGBUILD; then
            echo nothing to do
            exit 0
          fi
          ver=$(awk -F= '/^pkgver=/ {print $2; exit}' packages/keeper-password-manager/PKGBUILD)
          branch="keeper-$ver"
          git checkout -b "$branch"
          git add packages/keeper-password-manager/PKGBUILD
          git commit -m "chore(keeper): $ver from vendor SHASUM256.txt"
          git push -u origin "$branch"
          gh pr create --title "chore(keeper): $ver" --body "Hash taken from https://keepersecurity.com/desktop_electron/SHASUM256.txt
          Human must merge. Bot cannot add packages."
